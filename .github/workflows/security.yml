
name: SavannaGuard Security

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "17 3 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-validation:
    name: JavaScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Run JavaScript tests
        run: npm test

      - name: Validate crawler syntax
        run: node --check workers/crawler.js

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
