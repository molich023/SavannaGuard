
name = "savanna-search-crawler"
main = "crawler.js"
compatibility_date = "2026-09-17"

[triggers]
crons = ["17 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

# Set SEARCH_ADMIN_TOKEN, INGEST_URL and SAVANNA_SEEDS
# as Cloudflare secrets/variables.
